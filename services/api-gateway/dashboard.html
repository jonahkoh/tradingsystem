<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --green: #3fb950;
    --red: #f85149; --yellow: #d29922; --blue: #58a6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace; background: var(--bg); color: var(--text); padding: 20px; font-size: 14px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }

  .stat { font-size: 28px; font-weight: 700; }
  .stat-sm { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neutral { color: var(--muted); }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .badge-green { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-red { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-yellow { background: rgba(210,153,34,0.15); color: var(--yellow); }
  .badge-blue { background: rgba(88,166,255,0.15); color: var(--blue); }
  .badge-muted { background: rgba(139,148,158,0.15); color: var(--muted); }

  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .header h1 { font-size: 20px; font-weight: 700; }
  .header-right { display: flex; gap: 10px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-green { background: var(--green); }
  .dot-red { background: var(--red); }
  .dot-yellow { background: var(--yellow); }

  button { font-family: inherit; font-size: 13px; padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-weight: 600; transition: opacity 0.15s; }
  button:hover { opacity: 0.85; }
  .btn-kill { background: var(--red); color: #fff; border-color: var(--red); }
  .btn-resume { background: var(--green); color: #fff; border-color: var(--green); }

  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center; }
  .confirm-overlay.active { display: flex; }
  .confirm-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; max-width: 380px; text-align: center; }
  .confirm-box h3 { margin-bottom: 12px; font-size: 16px; }
  .confirm-box p { color: var(--muted); margin-bottom: 20px; font-size: 13px; }
  .confirm-box .btn-row { display: flex; gap: 10px; justify-content: center; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
  tr:last-child td { border-bottom: none; }

  .wallet-row { display: flex; justify-content: space-between; padding: 6px 0; }
  .wallet-row:not(:last-child) { border-bottom: 1px solid var(--border); }
  .wallet-asset { font-weight: 600; }
  .wallet-free { color: var(--green); }
  .wallet-locked { color: var(--yellow); }

  .sentiment-bar { height: 6px; border-radius: 3px; background: var(--border); margin-top: 8px; position: relative; overflow: hidden; }
  .sentiment-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .loading { animation: pulse 1.5s infinite; }
</style>
</head>
<body>

<div class="header">
  <h1>Trading Dashboard</h1>
  <div class="header-right">
    <span id="wsStatus"><span class="dot dot-yellow"></span> connecting</span>
    <span style="color:var(--muted); font-size:12px" id="lastUpdate">--</span>
    <button class="btn-kill" onclick="showConfirm('kill')">HALT</button>
    <button class="btn-resume" onclick="showConfirm('resume')">RESUME</button>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2>Market Price</h2>
    <div class="stat" id="marketPrice">--</div>
    <div class="stat-sm" id="marketSymbol">--</div>
  </div>
  <div class="card">
    <h2>Position</h2>
    <div class="stat" id="posQty">--</div>
    <div class="stat-sm" id="posEntry">--</div>
  </div>
  <div class="card">
    <h2>Unrealised PNL</h2>
    <div class="stat" id="unrealPnl">--</div>
    <div class="stat-sm" id="posStopLoss">--</div>
  </div>
</div>

<div class="grid">
  <div class="card">
    <h2>Sentiment</h2>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="badge badge-muted" id="sentimentBadge">--</span>
      <span id="sentimentScore" style="font-size:16px; font-weight:600;">--</span>
    </div>
    <div class="sentiment-bar"><div class="sentiment-fill" id="sentimentFill"></div></div>
    <div class="stat-sm" style="margin-top:8px;" id="sentimentHeadline">--</div>
  </div>
  <div class="card">
    <h2>Strategy State</h2>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <span class="badge badge-muted" id="stratState">--</span>
      <span class="badge badge-muted" id="stratPending">--</span>
    </div>
    <div class="stat-sm" style="margin-top:10px;" id="stratDetail">--</div>
  </div>
  <div class="card">
    <h2>Wallet Balance</h2>
    <div id="walletContainer" class="loading" style="font-size:13px;">Loading...</div>
  </div>
</div>

<div class="grid-2">
  <div class="card" style="max-height:400px; overflow-y:auto;">
    <h2>Recent Trades</h2>
    <table>
      <thead><tr><th>Time</th><th>Side</th><th>Price</th><th>Qty</th><th>Status</th></tr></thead>
      <tbody id="tradesBody"><tr><td colspan="5" class="loading" style="color:var(--muted)">Loading...</td></tr></tbody>
    </table>
  </div>
  <div class="card" style="max-height:400px; overflow-y:auto;">
    <h2>Live Event Log</h2>
    <div id="eventLog" style="font-size:12px; line-height:1.8;"><span style="color:var(--muted)">Waiting for events...</span></div>
  </div>
</div>

<!-- Confirmation dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3 id="confirmTitle">Confirm</h3>
    <p id="confirmMsg">Are you sure?</p>
    <div class="btn-row">
      <button style="background:var(--surface);" onclick="hideConfirm()">Cancel</button>
      <button id="confirmBtn" class="btn-kill" onclick="executeAction()">Confirm</button>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
const WS_URL = `ws://${window.location.host}/ws/stream`;

let currentPrice = 0;
let pendingAction = null;
let ws = null;
const maxEvents = 80;
const events = [];

// --- Polling ---
async function fetchJSON(path) {
  try {
    const r = await fetch(`${API}${path}`);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch (e) { console.warn(`fetch ${path}:`, e); return null; }
}

async function pollPosition() {
  const d = await fetchJSON('/api/position');
  if (!d) return;

  const qty = parseFloat(d.quantity) || 0;
  const entry = d.entry_price || 0;
  const sl = d.stop_loss_price || 0;

  document.getElementById('posQty').textContent = qty > 0 ? `${qty.toFixed(4)} BTC` : 'FLAT';
  document.getElementById('posQty').className = `stat ${qty > 0 ? 'pos' : 'neutral'}`;

  document.getElementById('posEntry').textContent = entry > 0 ? `Entry: $${entry.toFixed(2)}` : '--';
  document.getElementById('posStopLoss').textContent = sl > 0 ? `Stop-loss: $${sl.toFixed(2)}` : '--';

  // Strategy state badges
  const stateEl = document.getElementById('stratState');
  stateEl.textContent = d.in_position ? 'IN POSITION' : 'OUT';
  stateEl.className = `badge ${d.in_position ? 'badge-green' : 'badge-muted'}`;

  const pendEl = document.getElementById('stratPending');
  if (d.pending_action) {
    pendEl.textContent = `PENDING ${d.pending_action}`;
    pendEl.className = 'badge badge-yellow';
  } else {
    pendEl.textContent = 'IDLE';
    pendEl.className = 'badge badge-muted';
  }

  document.getElementById('stratDetail').textContent =
    d.in_position ? `Holding ${qty.toFixed(4)} @ $${entry.toFixed(2)}` : 'Waiting for entry signal';

  // Sentiment badge
  const sentBadge = document.getElementById('sentimentBadge');
  sentBadge.textContent = d.sentiment || '--';
  const sentColors = { SEVERE_FEAR: 'badge-red', UNEASE: 'badge-yellow', NEUTRAL: 'badge-blue', HYPE: 'badge-green' };
  sentBadge.className = `badge ${sentColors[d.sentiment] || 'badge-muted'}`;

  // Unrealised PNL
  if (qty > 0 && entry > 0 && currentPrice > 0) {
    const pnl = (currentPrice - entry) * qty;
    const el = document.getElementById('unrealPnl');
    el.textContent = `${pnl >= 0 ? '+' : ''}$${pnl.toFixed(4)}`;
    el.className = `stat ${pnl >= 0 ? 'pos' : 'neg'}`;
  } else {
    const el = document.getElementById('unrealPnl');
    el.textContent = '$0.00';
    el.className = 'stat neutral';
  }
}

async function pollBalance() {
  const d = await fetchJSON('/api/balance');
  const container = document.getElementById('walletContainer');
  container.classList.remove('loading');

  if (!d || !d.Wallet) { container.textContent = 'Unavailable'; return; }

  const wallet = d.Wallet;
  const assets = Object.keys(wallet).filter(a => {
    const free = parseFloat(wallet[a].Free || 0);
    const lock = parseFloat(wallet[a].Lock || 0);
    return free > 0.00001 || lock > 0.00001;
  });

  if (assets.length === 0) { container.textContent = 'Empty'; return; }

  container.innerHTML = assets.map(a => {
    const free = parseFloat(wallet[a].Free || 0);
    const lock = parseFloat(wallet[a].Lock || 0);
    return `<div class="wallet-row">
      <span class="wallet-asset">${a}</span>
      <span><span class="wallet-free">${free.toFixed(4)}</span>${lock > 0.00001 ? ` <span class="wallet-locked">(${lock.toFixed(4)} locked)</span>` : ''}</span>
    </div>`;
  }).join('');
}

async function pollTrades() {
  const d = await fetchJSON('/api/trades');
  const tbody = document.getElementById('tradesBody');
  if (!d || d.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">No trades yet</td></tr>'; return; }

  tbody.innerHTML = d.slice(0, 20).map(t => {
    const side = (t.Action || '').toUpperCase();
    const cls = side === 'BUY' ? 'pos' : side === 'SELL' ? 'neg' : '';
    const price = parseFloat(t.Price || 0);
    const qty = parseFloat(t.Quantity || 0);
    const ts = t.Timestamp || '--';
    const short = ts.length > 19 ? ts.slice(11, 19) : ts;
    const status = (t.API_Status || '').includes('SUCCESS') ? 'OK' : t.API_Status || '--';
    return `<tr>
      <td style="color:var(--muted)">${short}</td>
      <td class="${cls}" style="font-weight:600">${side}</td>
      <td>$${price.toFixed(2)}</td>
      <td>${qty.toFixed(6)}</td>
      <td>${status}</td>
    </tr>`;
  }).join('');
}

// --- WebSocket ---
function connectWS() {
  ws = new WebSocket(WS_URL);
  const statusEl = document.getElementById('wsStatus');

  ws.onopen = () => {
    statusEl.innerHTML = '<span class="dot dot-green"></span> live';
  };

  ws.onclose = () => {
    statusEl.innerHTML = '<span class="dot dot-red"></span> disconnected';
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      const ch = msg.channel;
      const data = msg.data;

      if (ch === 'market_data') {
        currentPrice = parseFloat(data.mid_price) || 0;
        document.getElementById('marketPrice').textContent = `$${currentPrice.toFixed(2)}`;
        document.getElementById('marketSymbol').textContent = data.symbol || '--';
        document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
      }

      if (ch === 'sentiment_signals') {
        const score = parseFloat(data.compound_score) || 0;
        document.getElementById('sentimentScore').textContent = score.toFixed(3);
        const pct = Math.min(Math.max((score + 1) / 2 * 100, 0), 100);
        const fill = document.getElementById('sentimentFill');
        fill.style.width = pct + '%';
        fill.style.background = score < -0.05 ? 'var(--red)' : score > 0.25 ? 'var(--green)' : 'var(--blue)';
        if (data.latest_headline) {
          document.getElementById('sentimentHeadline').textContent = data.latest_headline.slice(0, 80);
        }
      }

      if (ch === 'position_updates') {
        pollPosition();
      }

      if (ch === 'trade_signals') {
        const action = data.action || '?';
        const reason = data.reason || '';
        addEvent(`SIGNAL ${action} — ${reason}`, action === 'BUY' ? 'pos' : 'neg');
        pollTrades();
      }

      if (ch !== 'market_data') {
        addEvent(`[${ch}] ${JSON.stringify(data).slice(0, 120)}`, 'neutral');
      }
    } catch (err) { console.warn('ws parse:', err); }
  };
}

function addEvent(text, cls) {
  events.unshift({ text, cls, ts: new Date().toLocaleTimeString() });
  if (events.length > maxEvents) events.length = maxEvents;
  const el = document.getElementById('eventLog');
  el.innerHTML = events.map(e =>
    `<div><span style="color:var(--muted)">${e.ts}</span> <span class="${e.cls}">${escapeHtml(e.text)}</span></div>`
  ).join('');
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- Kill/Resume with confirmation ---
function showConfirm(action) {
  pendingAction = action;
  document.getElementById('confirmTitle').textContent =
    action === 'kill' ? 'Halt Pipeline' : 'Resume Pipeline';
  document.getElementById('confirmMsg').textContent =
    action === 'kill'
      ? 'This will stop all trading immediately. Confirm?'
      : 'This will resume automated trading. Confirm?';
  const btn = document.getElementById('confirmBtn');
  btn.textContent = action === 'kill' ? 'HALT NOW' : 'RESUME';
  btn.className = action === 'kill' ? 'btn-kill' : 'btn-resume';
  document.getElementById('confirmOverlay').classList.add('active');
}

function hideConfirm() {
  document.getElementById('confirmOverlay').classList.remove('active');
  pendingAction = null;
}

async function executeAction() {
  if (!pendingAction) return;
  const endpoint = pendingAction === 'kill' ? '/api/kill' : '/api/resume';
  hideConfirm();
  try {
    const r = await fetch(`${API}${endpoint}`, { method: 'POST' });
    const d = await r.json();
    addEvent(`CONTROL: ${d.command || d.message || 'sent'}`, pendingAction === 'kill' ? 'neg' : 'pos');
  } catch (e) {
    addEvent(`CONTROL ERROR: ${e.message}`, 'neg');
  }
}

// close on Escape
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideConfirm(); });

// --- Bootstrap ---
connectWS();
pollPosition();
pollBalance();
pollTrades();

setInterval(pollPosition, 3000);
setInterval(pollBalance, 10000);
setInterval(pollTrades, 5000);
</script>
</body>
</html>
