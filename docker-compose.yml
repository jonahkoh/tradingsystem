services:

  # ── Infrastructure ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tradingsystem_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --loglevel notice
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Process A — Feed Handler ──────────────────────────────────────────────────
  feed-handler:
    build:
      context: .
      dockerfile: services/feed-handler/Dockerfile
    container_name: tradingsystem_feed_handler
    env_file: .env
    environment:
      REDIS_HOST: redis
      EXCHANGE: ${EXCHANGE:-roostoo}
      TRADE_SYMBOLS: BTC/USD,ETH/USD,SOL/USD,XRP/USD,FET/USD
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process B — BTC Strategy Engine ───────────────────────────────────────────
  btc-strategy-engine:
    build:
      context: .
      dockerfile: services/strategy-engine/Dockerfile
    container_name: tradingsystem_strategy_engine
    env_file: .env
    environment:
      REDIS_HOST: redis
      STRATEGY_FILE: btc_eth_strategy_engine.py
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process C — Execution Manager ─────────────────────────────────────────────
  execution-manager:
    build:
      context: .
      dockerfile: services/execution-manager/Dockerfile
    container_name: tradingsystem_execution_manager
    env_file: .env
    environment:
      REDIS_HOST: redis
      EXCHANGE: ${EXCHANGE:-roostoo}
      LOG_DIR: /data/logs
      LOG_FILE: /data/logs/execution_log.csv
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
    restart: unless-stopped

  # ── Process D — Ledger & Risk Monitor ─────────────────────────────────────────
  ledger:
    build:
      context: .
      dockerfile: services/ledger/Dockerfile
    container_name: tradingsystem_ledger
    env_file: .env
    environment:
      REDIS_HOST: redis
      LOG_DIR: /data/logs
      LOG_FILE: /data/logs/execution_log.csv
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
    restart: unless-stopped

  # ── Process E — API Gateway & Kill Switch ─────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: tradingsystem_api_gateway
    env_file: .env
    environment:
      REDIS_HOST: redis
      LOG_DIR: /data/logs
      LOG_FILE: /data/logs/execution_log.csv
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # ── Process F — Sentiment Oracle ───────────────────────────────────────────────
  sentiment-oracle:
    build:
      context: .
      dockerfile: services/sentiment-oracle/Dockerfile
    container_name: tradingsystem_sentiment_oracle
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process H — SOL EMA Momentum Strategy ─────────────────────────────────────
  sol-strategy-engine:
    build:
      context: .
      dockerfile: services/strategy-engine/Dockerfile
    container_name: tradingsystem_sol_strategy
    env_file: .env
    environment:
      REDIS_HOST: redis
      TRADE_SYMBOL: SOL/USD
      STRATEGY_FILE: sol_strategy_engine.py
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process G — XRP ATR Breakout Strategy ─────────────────────────────────────
  xrp-strategy-engine:
    build:
      context: .
      dockerfile: services/strategy-engine/Dockerfile
    container_name: tradingsystem_xrp_strategy
    env_file: .env
    environment:
      REDIS_HOST: redis
      TRADE_SYMBOL: XRP/USD
      STRATEGY_FILE: xrp_strategy_engine.py
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process I — ETH Bollinger Band Mean Reversion Strategy ───────────────────
  # Reuses strategy-engine (BTC) code; ETH_ prefixed env vars override BTC params.
  eth-strategy-engine:
    build:
      context: .
      dockerfile: services/strategy-engine/Dockerfile
    container_name: tradingsystem_eth_strategy
    env_file: .env
    environment:
      REDIS_HOST: redis
      TRADE_SYMBOL: ETH/USD
      STRATEGY_FILE: btc_eth_strategy_engine.py
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process J — FET ATR Breakout Strategy ────────────────────────────────────
  fet-strategy-engine:
    build:
      context: .
      dockerfile: services/strategy-engine/Dockerfile
    container_name: tradingsystem_fet_strategy
    env_file: .env
    environment:
      REDIS_HOST: redis
      TRADE_SYMBOL: FET/USD
      STRATEGY_FILE: fet_strategy_engine.py
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── SOL MA(7/99) Crossover Test Strategy (Binance testnet validation) ────────
  sol-ma-test:
    build:
      context: .
      dockerfile: services/strategy-engine/Dockerfile
    container_name: tradingsystem_sol_ma_test
    env_file: .env
    environment:
      REDIS_HOST: redis
      TRADE_SYMBOL: SOL/USD
      STRATEGY_FILE: sol_ma_test_strategy.py
      SOL_TEST_QTY: "1"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: tradingsystem_net
