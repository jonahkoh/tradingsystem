services:

  # ── Infrastructure ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tradingsystem_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --loglevel notice
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Process A — Feed Handler ──────────────────────────────────────────────────
  feed-handler:
    build:
      context: .
      dockerfile: services/feed-handler/Dockerfile
    container_name: tradingsystem_feed_handler
    env_file: .env
    environment:
      REDIS_HOST: redis       # override localhost → docker service name
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process B — Strategy Engine ───────────────────────────────────────────────
  strategy-engine:
    build:
      context: .
      dockerfile: services/strategy-engine/Dockerfile
    container_name: tradingsystem_strategy_engine
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process C — Execution Manager ─────────────────────────────────────────────
  execution-manager:
    build:
      context: .
      dockerfile: services/execution-manager/Dockerfile
    container_name: tradingsystem_execution_manager
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process D — Ledger & Risk Monitor ─────────────────────────────────────────
  ledger:
    build:
      context: .
      dockerfile: services/ledger/Dockerfile
    container_name: tradingsystem_ledger
    env_file: .env
    environment:
      REDIS_HOST: redis
      LOG_DIR: /data/logs
      LOG_FILE: /data/logs/execution_log.csv
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/data
    restart: unless-stopped

  # ── Process E — API Gateway & Kill Switch ─────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: tradingsystem_api_gateway
    env_file: .env
    environment:
      REDIS_HOST: redis
      LOG_DIR: /data/logs
      LOG_FILE: /data/logs/execution_log.csv
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # ── Process F — Sentiment Oracle ───────────────────────────────────────────────
  sentiment-oracle:
    build:
      context: .
      dockerfile: services/sentiment-oracle/Dockerfile
    container_name: tradingsystem_sentiment_oracle
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process A2 — Feed Handler (SOL) ──────────────────────────────────────────
  # Reuses the same market_data.py image; TRADE_SYMBOL override switches the pair.
  feed-handler-sol:
    build:
      context: .
      dockerfile: services/feed-handler/Dockerfile
    container_name: tradingsystem_feed_handler_sol
    env_file: .env
    environment:
      REDIS_HOST: redis
      TRADE_SYMBOL: SOL/USD
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process H — SOL EMA Momentum Strategy ─────────────────────────────────────
  sol-strategy-engine:
    build:
      context: .
      dockerfile: services/sol-strategy/Dockerfile
    container_name: tradingsystem_sol_strategy
    env_file: .env
    environment:
      REDIS_HOST: redis
      TRADE_SYMBOL: SOL/USD
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process A3 — Feed Handler (XRP) ──────────────────────────────────────────
  # Reuses the same market_data.py image; TRADE_SYMBOL override switches the pair.
  # Publishes {"symbol": "XRP/USD", ...} to the shared market_data channel.
  feed-handler-xrp:
    build:
      context: .
      dockerfile: services/feed-handler/Dockerfile
    container_name: tradingsystem_feed_handler_xrp
    env_file: .env
    environment:
      REDIS_HOST: redis
      TRADE_SYMBOL: XRP/USD
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Process G — XRP ATR Breakout Strategy ─────────────────────────────────────
  xrp-strategy-engine:
    build:
      context: .
      dockerfile: services/xrp-strategy/Dockerfile
    container_name: tradingsystem_xrp_strategy
    env_file: .env
    environment:
      REDIS_HOST: redis
      TRADE_SYMBOL: XRP/USD
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: tradingsystem_net
